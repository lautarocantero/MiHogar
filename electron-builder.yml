appId: com.mihogar.app
productName: Mi Hogar
copyright: Copyright © 2026 Lautaro Cantero

directories:
  output: release
  buildResources: resources

files:
  - out/**/*
  - resources/**/*
  - package.json

asar: true

publish:
  provider: github
  owner: lautarocantero
  repo: MiHogar
  draft: false

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.finance

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Office
  maintainer: Lautaro Cantero
